/* CARTOON EDITION · clean comic lines, bold blue and yellow accents */
:root{--ink:#202a36;--muted:#687687;--line:#253244;--soft:#f4f7fb;--blue:#2365bd}
body{background:#fff;color:#202a36;font-weight:450}
main{max-width:1120px}
h1,h2,h3,.group-head span,.work h3,.step h3,.button{font-weight:750}
.eyebrow{color:#2365bd;letter-spacing:1.7px;font-weight:800}
.profile{padding-top:44px;padding-bottom:42px}
.avatar{background:#f2f7ff;border:2px solid #253244;border-radius:14px;box-shadow:4px 4px 0 #253244}
.avatar svg{stroke:#2365bd}
.profile h1{font-size:27px;letter-spacing:-.8px}
.profile-role{color:#44556a}
.profile-copy>p:last-child{color:#657183}
section{border-bottom:0}
.section-head{margin-bottom:22px}
.section-head h2{display:inline-block;background:#fff;border:2px solid #253244;border-radius:7px;padding:5px 12px 7px;box-shadow:3px 3px 0 #253244}
.section-head .eyebrow{margin-bottom:11px}
.portfolio-group{padding:21px 0 22px}
.group-head{margin-bottom:15px;gap:10px}
.group-head span{font-size:13px;color:#202a36;background:#fff;border:2px solid #253244;border-radius:6px;padding:6px 12px;box-shadow:3px 3px 0 #253244;position:relative}
.group-head span:before{content:'✦';font-size:10px;color:#e9b928;margin-right:7px}
.group-grid{gap:22px 24px}
.portfolio-group .work{padding:0}
.portfolio-group .media{border:2px solid #253244;border-radius:8px;background:#f1f5fa;box-shadow:4px 4px 0 #253244;overflow:hidden;margin:0 4px 16px 0}
.portfolio-group .media video{background:#f1f5fa}
.placeholder{background-color:#f1f5fa;background-image:radial-gradient(#c7d5e7 .8px,transparent .8px);background-size:10px 10px}
.placeholder svg{color:#2365bd}
.work-head{align-items:center;gap:8px}
.portfolio-group .work h3{font-size:15px;color:#202a36}
.price{color:#202a36;background:#ffe276;border:2px solid #253244;border-radius:5px;padding:3px 9px;box-shadow:2px 2px 0 #253244;font-weight:750}
.work p{color:#58677a;font-weight:500}
.tags .tag{border:1px solid #253244;background:#edf5ff;color:#284e7c;border-radius:4px;font-weight:650}
.away-group{margin-top:2px}
.custom-note{font-size:14px!important;font-weight:700;color:#263b55!important;}
.process{border:0;border-radius:0;gap:13px;overflow:visible}
.step{border:2px solid #253244;border-radius:8px;background:#fff;padding:20px 17px;box-shadow:4px 4px 0 #253244}
.step+.step{border-left:2px solid #253244}
.step:nth-child(2){background:#fff8df}.step:nth-child(4){background:#edf5ff}
.step small{font-weight:800;color:#2365bd}
.step h3{font-size:14px}
.step:not(:last-child):after{right:-11px;width:22px;height:22px;top:calc(50% - 11px);display:grid;place-content:center;z-index:1;background:#ffe276;border:2px solid #253244;border-radius:50%;color:#202a36;font-size:12px}
.field>span,.label{font-weight:750;color:#34445a}
input:not([type=radio]):not([type=checkbox]),textarea{border:2px solid #253244;border-radius:6px;box-shadow:2px 2px 0 #d8e0eb;background:#fff}
input:focus,textarea:focus{box-shadow:3px 3px 0 #a8c8f1}
.choice{border:2px solid #253244;border-radius:7px;background:#fff;box-shadow:2px 2px 0 #dce3eb;font-weight:600}
.choice:has(input:checked){background:#fff4c9;border-color:#253244;box-shadow:3px 3px 0 #e3b829}
.choice .cost{color:#42556d;font-weight:650}
.radios label{font-weight:600}
input[type=radio],input[type=checkbox]{accent-color:#2365bd}
.total{background:#fff8df;border:2px solid #253244;border-radius:8px;box-shadow:3px 3px 0 #253244}
.total strong{color:#1e4d85;font-weight:800}
.button{border:2px solid #253244;border-radius:7px;box-shadow:3px 3px 0 #253244;transition:transform .12s,box-shadow .12s}
.button:hover:not(:disabled){transform:translate(1px,1px);box-shadow:2px 2px 0 #253244}
.primary{background:#2365bd;border-color:#253244;color:#fff}
.notes-list li{color:#596779}
.notes-list li:before{width:7px;height:7px;top:8px;background:#ffe276;border:1px solid #253244}
#output{box-shadow:2px 2px 0 #d8e0eb}
footer{border-top:2px solid #253244;color:#607084}
@media(max-width:600px){
 .profile{padding:31px 0 29px;gap:18px}
 .avatar,.avatar img{width:75px;height:75px}
 .profile h1{font-size:19px}
 .section-head h2{font-size:21px;padding:4px 9px 5px;box-shadow:2px 2px 0 #253244}
 .group-head span{font-size:11px;padding:5px 9px;box-shadow:2px 2px 0 #253244}
 .group-grid{gap:17px 11px}
 .portfolio-group .media{box-shadow:3px 3px 0 #253244;margin:0 3px 12px 0}
 .portfolio-group .work h3{font-size:13px}
 .price{font-size:10px;padding:2px 6px;box-shadow:1px 1px 0 #253244}
 .step{padding:14px 14px;box-shadow:3px 3px 0 #253244}
 .step+.step{border-left:2px solid #253244}
 .step:not(:last-child):after{right:auto;left:calc(50% - 11px);top:auto;bottom:-12px;content:'↓'}
 .process{gap:12px}
 .choice{padding:11px}
 .button{box-shadow:2px 2px 0 #253244}
}
@media(prefers-reduced-motion:reduce){.button{transition:none}}

/* Single-video categories use the full portfolio width. */
.portfolio-group.single-group .group-grid{grid-template-columns:1fr}
.portfolio-group.single-group .work{width:100%}
.portfolio-group.single-group .media video{width:100%;max-height:520px;object-fit:contain}
@media(max-width:600px){.portfolio-group.single-group .media video{max-height:58vh;max-height:58svh}.portfolio-group.away-group .group-grid{grid-template-columns:1fr}}

/* Three major content groups: portfolio through away effects, process, request form. */
#catalog>.portfolio-group+.portfolio-group{margin-top:54px}
.group-head{margin-bottom:22px}
@media(max-width:600px){#catalog>.portfolio-group+.portfolio-group{margin-top:40px}.group-head{margin-bottom:17px}}
.portfolio-section,.process-section,#request{border:2px solid #253244;border-radius:11px;padding:22px 24px 25px;margin:0 0 34px;box-shadow:5px 5px 0 #253244;background:#fff}
.portfolio-section .section-head,.process-section .section-head,#request .section-head{margin-bottom:22px}
.portfolio-section .portfolio-group:last-of-type{padding-bottom:14px}
.process-section .process{margin-top:2px}
#request .form-grid{gap:21px}
@media(max-width:600px){
 .portfolio-section,.process-section,#request{padding:15px 13px 18px;margin-bottom:25px;border-radius:9px;box-shadow:4px 4px 0 #253244}
 .portfolio-section .section-head,.process-section .section-head,#request .section-head{margin-bottom:18px}
 #request .form-grid{gap:18px}
}


/* Product details box keeps title, price and caption together beneath each video. */
.work-info{border:2px solid #253244;border-radius:7px;padding:9px 11px 10px;background:#fff;box-shadow:3px 3px 0 #253244}
.work-info .work-head{align-items:center}
.work-info .work-head h3{font-size:14px}
.work-info .price{flex-shrink:0}
.work-info>p{font-size:12px;margin:7px 0 0;color:#526276;line-height:1.65}
.work-info .tags{margin-top:8px}
@media(max-width:600px){.work-info{padding:7px 8px 8px;box-shadow:2px 2px 0 #253244}.work-info .work-head h3{font-size:12px}.work-info .price{font-size:10px}.work-info>p{font-size:10px;margin-top:5px}}


/* One comic card contains the video and every product detail. */
.portfolio-group .work{padding:10px 10px 12px;border:2px solid #253244;border-radius:9px;background:#fff;box-shadow:4px 4px 0 #253244}
.portfolio-group .work .media{border:0;border-radius:5px;box-shadow:none;margin:0 0 8px;background:#f1f5fa}
.portfolio-group .work-info{border:0;border-top:1px solid #dce3eb;border-radius:0;box-shadow:none;padding:9px 2px 2px;background:transparent}
@media(max-width:600px){.portfolio-group .work{padding:7px 7px 9px;box-shadow:3px 3px 0 #253244}.portfolio-group .work .media{margin-bottom:6px}.portfolio-group .work-info{padding-top:7px}}


/* Thin portfolio rule under every product to echo the Portfolio heading divider. */
.portfolio-group .work{position:relative;margin-bottom:12px}
.portfolio-group .work:after{content:"";display:block;height:1px;background:#b9c2ce;margin:13px 0 0;opacity:.9}
@media(max-width:600px){.portfolio-group .work{margin-bottom:8px}.portfolio-group .work:after{margin-top:10px}}


/* Dividers belong at the end of each category, never under individual products. */
.portfolio-group .work:after{display:none!important}
#catalog>.portfolio-group:not(.away-group){border-bottom:1px solid #aeb9c7;padding-bottom:29px}
#catalog>.portfolio-group.away-group{border-bottom:0;padding-bottom:0}
@media(max-width:600px){#catalog>.portfolio-group:not(.away-group){padding-bottom:24px}#catalog>.portfolio-group.away-group{padding-bottom:0}}


/* Remove all portfolio divider rules; spacing and the individual product cards separate content. */
.section-head:has(+ .portfolio){border-bottom:0!important;padding-bottom:0!important}
#catalog>.portfolio-group:not(.away-group),#catalog>.portfolio-group.away-group{border-bottom:0!important}


/* Responsive refinements for embedded ArtMug pages and narrow phones. */
html,body{width:100%;max-width:100%;overflow-x:hidden}
main{width:min(1120px,calc(100% - 48px));min-width:0}
img,video,svg{max-width:100%}
.portfolio-section,.process-section,#request{min-width:0}

 .work-info .work-head h3{font-size:11px}

}

<section class="portfolio-section"><div class="section-head"><div><p class="eyebrow">PORTFOLIO</p><h2>포트폴리오</h2></div></div><div id="catalog" class="portfolio"></div></section>
<section class="process-section"><div class="section-head"><div><p class="eyebrow">PROCESS</p><h2>진행 과정</h2></div></div><div class="process"><div class="step"><small>01</small><h3>문의</h3></div><div class="step"><small>02</small><h3>견적 및 일정안내</h3></div><div class="step"><small>03</small><h3>주문</h3></div><div class="step"><small>04</small><h3>파일 전달 및 원격 셋팅</h3></div></div></section>
<section id="request"><div class="section-head"><div><p class="eyebrow">REQUEST</p><h2>신청 양식</h2></div><p>작성 후 복사하여 아트머그 문의로 보내주세요.</p></div><noscript>신청서 이용 시 JavaScript를 허용해 주세요.</noscript><form id="form" novalidate><div class="form-grid"><label class="field full"><span>방송 닉네임 <small class="required">필수</small></span><input name="nickname" required placeholder="방송에서 사용하는 닉네임"></label><label class="field full"><span>방송국 주소 <small class="required">필수</small></span><input name="channel" type="url" required placeholder="https://방송 채널 주소"></label><div class="full"><span class="label">와루도 버전 <small class="required">필수</small></span><div class="radios" id="edition"><label><input type="radio" name="edition" value="일반">일반</label><label><input type="radio" name="edition" value="Pro">Pro</label></div></div><div class="full"><span class="label">원하는 API <small class="required">복수 선택 가능</small></span><div class="choices" id="choices"></div></div><label class="field full"><span>기타 문의사항</span><textarea name="extra" placeholder="원하는 연출, 실행 조건, 궁금한 점이나 참고 링크를 적어주세요."></textarea><p class="help" id="custom-help" hidden>자체 제작 요청은 원하는 동작과 효과를 구체적으로 적어주세요.</p></label><div class="total full"><span>선택 항목 기준 합계</span><strong id="total" aria-live="polite">선택 기능 합계 0원</strong></div></div><div class="actions"><button class="button primary" type="submit">신청 내용 복사하기</button><a id="inquiry" class="button" target="_blank" rel="noopener noreferrer" hidden>아트머그 문의하기 ↗</a></div><p class="help">하단 주의사항을 확인한 후 문의해 주세요.</p><p id="status" role="status"></p><div id="manual" hidden><label class="field"><span>완성된 신청서</span><textarea id="output" readonly></textarea></label><button type="button" class="button" id="select-output">전체 선택하여 직접 복사</button></div></form></section>
<section class="notes"><div class="section-head"><div><p class="eyebrow">PLEASE READ</p><h2>주의사항</h2></div></div><ul class="notes-list" id="notes"></ul></section></main><footer>WARUDO API · BLUEPRINT</footer>
<script>
// 수정: 프로필·문의 URL은 CONFIG, 기능·가격·설명은 FEATURES, 영상은 VIDEOS.
const CONFIG={author:'와루도 API · 뚜따',bio:'상상하시던 API 문의 주세요\n옷장 리모컨, 와루도 합방 설정 등 세팅 지원 가능',profileImage:'assets/profile.png',inquiryUrl:'',draft:true,parentOrigin:'*'};
const FEATURES=[
 {id:'transform',name:'마법소녀변신',price:60000,description:'포즈 커스텀 가능'},
 {id:'karaoke',name:'노래방',price:50000,description:'노래방 맵 자체 제작'},
 {id:'optimization',name:'와루도 최적화',price:100000,description:'파츠 제한없이 와루도 최적화 가능'},
 {id:'movingHeart',name:'움직임하트',price:50000,description:''},
 {id:'heart',name:'뻐큐앤하트',price:30000,description:''},
 {id:'strong',name:'강력 던지기',price:20000,description:'사용할 PROP과 한 번 실행할 때 던질 개수를 지정해 주세요.'},
 {id:'throw',name:'던지기',price:10000,description:'사용할 PROP과 한 번 실행할 때 던질 개수를 지정해 주세요.'},
 {id:'ping',name:'미아핑',price:20000,description:''},
 {id:'hammer',name:'뿅망치',price:20000,description:'때리는 횟수 선택 가능'},
 {id:'truck',name:'이세계트럭',price:10000,description:''},
 {id:'eyeheart',name:'눈하트',price:35000,description:''},
 {id:'zzz',name:'자리비움 ZZZ',price:20000,description:''},
 {id:'bubble',name:'자리비움 콧방울',price:20000,description:''},
 {id:'custom',name:'자체 제작 요청',price:null,description:''}
];
// 파일명 앞 숫자는 정렬에만 사용합니다. 자리비움 두 파일에는 뒤 순서인 10, 11을 붙였습니다.
// 번호는 정렬용입니다. 새 14번 플러그인 영상은 최적화 카테고리에 연결합니다.
const VIDEOS=[
 {order:1,file:'1.마법소녀변신.mp4',src:'assets/1.마법소녀변신.mp4',feature:'transform'},
 {order:2,file:'2.노래방.mp4',src:'assets/2.노래방.mp4',feature:'karaoke'},
 {order:3,file:'3.뻐큐앤하트.mp4',src:'assets/3.뻐큐앤하트.mp4',feature:'heart'},
 {order:4,file:'4.강력 던지기.mp4',src:'assets/4.강력 던지기.mp4',feature:'strong'},
 {order:5,file:'5.던지기.mp4',src:'assets/5.던지기.mp4',feature:'throw'},
 {order:6,file:'6.미아핑.mp4',src:'assets/6.미아핑.mp4',feature:'ping'},
 {order:7,file:'8.뿅망치.mp4',src:'assets/8.뿅망치.mp4',feature:'hammer'},
 {order:8,file:'9.이세계트럭.mp4',src:'assets/9.이세계트럭.mp4',feature:'truck'},
 {order:9,file:'10.자리비움_ZzzzZ.mp4',src:'assets/10.자리비움_ZzzzZ.mp4',feature:'zzz'},
 {order:10,file:'11.자리비움_콧방울.mp4',src:'assets/11.자리비움_콧방울.mp4',feature:'bubble'},
 {order:12,file:'12.눈하트.mp4',src:'assets/12.눈하트.mp4',feature:'eyeheart'},
 {order:14,file:'14.플러그인.mp4',src:'assets/14.플러그인.mp4',feature:'optimization'},
 {order:13,file:'13.움직임하트.mp4',src:'assets/13.움직임하트.mp4',feature:'movingHeart'}
];
const NOTES=[
'사용 중인 와루도 일반 / Pro 구분을 정확히 알려주세요. 원하는 연출과 실행 조건은 문의 시 함께 전달해 주세요.',
'원격 세팅 전 와루도 실행 상태와 필요한 파일을 확인하고, 기존 씬과 설정은 별도로 백업해 주세요.',
'원격 연결은 협의한 일정에 진행합니다.',
'PC 환경, 와루도 버전, 기존 플러그인·블루프린트 구성에 따라 적용 방식이 달라질 수 있으므로 사전에 확인이 필요합니다.',
'제작 과정에서 에셋 스토어의 에셋을 활용할 수 있습니다.',
'작가가 직접 제작한 부분의 저작권은 작가에게 있으며, 외부 에셋의 권리는 원저작자에게 있습니다.',
'제작물의 재배포 및 재판매는 절대 불가합니다. 적발 시 침해 내용과 피해 규모 등 사안에 따라 법적 대응이 진행될 수 있습니다.',
'모든 제작물은 작가의 포트폴리오로 사용될 수 있습니다. 공개를 원하지 않으시면 포트폴리오 비공개 옵션을 함께 주문해 주세요.',
];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n.toLocaleString('ko-KR')+'원',price=f=>f.price===null?(f.id==='custom'?'작가 협의':'가격 협의'):money(f.price);
const selected=()=>FEATURES.filter(f=>$(`[data-feature="${f.id}"]`).checked);
function totalLabel(items){const total=items.reduce((a,f)=>a+(f.price??0),0),custom=items.some(f=>f.id==='custom'),unpriced=items.filter(f=>f.price===null&&f.id!=='custom'),parts=[];if(items.some(f=>f.price!==null)||!items.length)parts.push(`선택 기능 합계 ${money(total)}`);if(custom)parts.push('자체 제작 비용 별도 협의');if(unpriced.length)parts.push(`${unpriced.map(f=>f.name).join(', ')} 가격 협의`);return parts.join(' + ');}
function videoOrder(v){if(Number.isFinite(v.order))return v.order;const match=v.file.match(/^(\d+)/);if(!match)throw Error('영상 순서를 확인해 주세요.');return Number(match[1]);}
function sortedVideos(){const s=[...VIDEOS].sort((a,b)=>videoOrder(a)-videoOrder(b));if(s.length){const orders=s.map(videoOrder);if(new Set(orders).size!==orders.length||s.some(v=>!FEATURES.some(f=>f.id===v.feature)))throw Error('영상 순서 또는 기능 연결을 확인해 주세요.');}return s;}
function card(f,v){return `<article class="work"><div class="media">${v?`<video autoplay muted loop playsinline preload="none" data-src="${esc(v.src)}" aria-label="${esc(v.title||f.name)} 영상 크게 보기" title="눌러서 크게 보기"></video><button type="button" class="play" hidden>▶ 재생</button><p class="media-error" hidden>영상을 불러오지 못했습니다.</p>`:`<div class="placeholder"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" stroke="currentColor"/><path d="M13 10l9 6-9 6V10Z" fill="currentColor"/></svg><span>영상 연결 예정</span></div>`}</div><div class="work-info"><div class="work-head"><h3>${esc(v?.title||f.name)}</h3><span class="price">${price(f)}</span></div>${f.description?`<p>${esc(f.description)}</p>`:''}${['strong','throw'].includes(f.id)?'<div class="tags"><span class="tag">숲 · 별풍선 PROP</span><span class="tag">치지직 · 치즈 PROP</span></div>':''}</div></article>`;}
const PORTFOLIO_GROUPS=[
 {title:'신규 의상 공개',ids:['transform']},
 {title:'최적화',ids:['optimization']},
 {title:'기타',ids:['movingHeart','karaoke']},
 {title:'시청자 티키타카',ids:['heart']},
 {title:'기본 API',ids:['eyeheart','strong','ping','hammer','throw','truck']},
 {title:'자리비움 연출',ids:['zzz','bubble']}
];
function renderCatalog(){let videos;try{videos=sortedVideos();}catch(e){$('#catalog').textContent=e.message;return;}
 const videoByFeature=new Map();
 if(videos.length){for(const v of videos){if(!videoByFeature.has(v.feature))videoByFeature.set(v.feature,[]);videoByFeature.get(v.feature).push(v);}}
 let html='';
 for(const group of PORTFOLIO_GROUPS){let items=[];for(const id of group.ids){const f=FEATURES.find(x=>x.id===id);if(!f)continue;const vs=videoByFeature.get(id);if(vs?.length)items.push(...vs.map(v=>({f,v})));}
 if(!items.length)continue;
 html+=`<section class="portfolio-group${items.length===1?' single-group':''}"><div class="group-head"><span>${esc(group.title)}</span><i></i></div><div class="group-grid">${items.map(({f,v})=>card(f,v)).join('')}</div></section>`;
 }
 html+='<div class="custom-note">이 외 API 자체제작 가능합니다 문의주세요</div>';$('#catalog').innerHTML=html;
}
renderCatalog();$('#author').textContent=CONFIG.author;$('#bio').textContent=CONFIG.bio;if(CONFIG.profileImage){const img=document.createElement('img');img.src=CONFIG.profileImage;img.alt='작가 프로필';$('#avatar').replaceChildren(img);}
$('#choices').innerHTML=FEATURES.map(f=>`<label class="choice"><input type="checkbox" data-feature="${f.id}"><span>${esc(f.name)}</span><span class="cost">${price(f)}</span></label>`).join('');$('#notes').innerHTML=NOTES.map(t=>`<li>${esc(t)}</li>`).join('');
if(/^https:\/\//i.test(CONFIG.inquiryUrl)){const u=new URL(CONFIG.inquiryUrl);if(u.hostname==='artmug.com'||u.hostname.endsWith('.artmug.com')){$('#inquiry').href=u.href;$('#inquiry').hidden=false;}}
const form=$('#form'),value=n=>String(form.elements.namedItem(n)?.value??'').trim();
function clearErrors(){$$('.error').forEach(e=>e.remove());$$('[aria-invalid]').forEach(e=>{e.removeAttribute('aria-invalid');e.removeAttribute('aria-describedby');e.classList.remove('invalid');});}
let errorId=0;function error(el,msg){const p=document.createElement('p');p.className='error';p.id='error-'+(++errorId);p.textContent=msg;el.insertAdjacentElement('afterend',p);el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby',p.id);el.classList.add('invalid');}
function validate(){clearErrors();if(!value('nickname'))error($('[name="nickname"]'),'방송 닉네임을 입력해 주세요.');if(!/^https?:\/\/[^\s/]+(?:\/[^\s]*)?$/i.test(value('channel')))error($('[name="channel"]'),'http:// 또는 https://로 시작하는 방송국 주소를 입력해 주세요.');if(!value('edition'))error($('#edition'),'일반 또는 Pro를 선택해 주세요.');if(!selected().length)error($('#choices'),'원하는 API를 선택해 주세요.');if(selected().some(f=>f.id==='custom')&&!value('extra'))error($('[name="extra"]'),'자체 제작을 원하는 동작과 효과를 적어주세요.');const first=$('[aria-invalid]');if(first){first.scrollIntoView({behavior:'smooth',block:'center'});(first.matches('input,textarea')?first:first.querySelector('input'))?.focus({preventScroll:true});}return !first;}
function application(){return ['[와루도 API 제작 신청서]','',`방송 닉네임: ${value('nickname')}`,`방송국 주소: ${value('channel')}`,`와루도 버전: ${value('edition')}`,'','[원하는 API]',...selected().map(f=>`- ${f.name}: ${price(f)}`),'',totalLabel(selected()),'※ 선택 항목 기준 합계입니다.','','[기타 문의사항]',value('extra')||'없음'].join('\n');}
form.addEventListener('change',()=>{$('#total').textContent=totalLabel(selected());$('#custom-help').hidden=!selected().some(f=>f.id==='custom');clearErrors();$('#status').textContent='';$('#manual').hidden=true;});form.addEventListener('input',()=>{$('#manual').hidden=true;$('#status').textContent='';});form.addEventListener('submit',async e=>{e.preventDefault();if(!validate())return;const text=application();$('#output').value=text;try{await navigator.clipboard.writeText(text);$('#status').textContent='신청 내용이 복사되었습니다. 아트머그 문의창에 붙여넣어 보내주세요.';}catch{$('#status').textContent='자동 복사가 제한되어 있습니다. 아래 신청서를 직접 선택하여 복사해 주세요.';}$('#manual').hidden=false;});$('#select-output').onclick=()=>{$('#output').focus();$('#output').select();};
let paused=false;const visible=new Set();async function play(v){if(paused||document.hidden)return;v.muted=true;v.defaultMuted=true;if(!v.src){v.src=v.dataset.src;v.load();}try{await v.play();if(paused||document.hidden||!visible.has(v)){v.pause();return;}v.nextElementSibling.hidden=true;}catch{if(visible.has(v)&&!paused)v.nextElementSibling.hidden=false;}}
const observer='IntersectionObserver'in window?new IntersectionObserver(entries=>entries.forEach(({target,isIntersecting})=>{if(isIntersecting){visible.add(target);play(target);}else{visible.delete(target);target.pause();}}),{threshold:.05}):null;
$$('video').forEach(v=>{v.muted=true;v.nextElementSibling.onclick=()=>{paused=false;visible.add(v);play(v);};v.addEventListener('error',()=>{v.parentElement.querySelector('.media-error').hidden=false;});if(observer)observer.observe(v);else{visible.add(v);play(v);}});document.addEventListener('visibilitychange',()=>{if(document.hidden)$$('video').forEach(v=>v.pause());else{visible.forEach(play);}});
if(window.parent!==window&&'ResizeObserver'in window){let last=0;new ResizeObserver(()=>{const height=Math.ceil(document.body.getBoundingClientRect().height);if(height!==last){last=height;window.parent.postMessage({type:'warudo-page-height',height},CONFIG.parentOrigin);}}).observe(document.body);}
</script></body></html>
